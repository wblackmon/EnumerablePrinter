name: Publish EnumerablePrinter

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore EnumerablePrinter.sln

      - name: Build
        run: dotnet build EnumerablePrinter.sln -c Release --no-restore

      - name: Test
        run: dotnet test EnumerablePrinter.sln -c Release --no-build --no-restore

      - name: Pack
        run: dotnet pack src/EnumerablePrinter/EnumerablePrinter.csproj -c Release --no-build -o ./nupkg

      - name: NuGet Login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: wblackmon

      - name: Publish to NuGet
        run: dotnet nuget push ./nupkg/*.nupkg --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json

      - name: Verify NuGet package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          package_url="https://api.nuget.org/v3-flatcontainer/enumerableprinter/${version}/enumerableprinter.${version}.nupkg"
          curl --fail --silent --show-error --location --retry 60 --retry-delay 10 --retry-all-errors --output /dev/null "$package_url"