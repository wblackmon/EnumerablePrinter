name: Publish EnumerablePrinter

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: windows-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore EnumerablePrinter.sln

      - name: Build
        run: dotnet build EnumerablePrinter.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/EnumerablePrinter.Tests/EnumerablePrinter.Tests.csproj -c Release --no-build --no-restore

      - name: Pack
        run: dotnet pack src/EnumerablePrinter/EnumerablePrinter.csproj -c Release --no-build -o ./nupkg

      - name: Publish to NuGet with Trusted Publishing
        uses: NuGet/actions/publish@v1
        with:
          package: ./nupkg/*.nupkg
          publish_mode: trusted